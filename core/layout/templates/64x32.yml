# 64×32 Layout Template - Wide Display
# All mode layouts for 64×32 panel
# Perfect for: Standard RGB matrix panels

# === SPORTS MODE ===
sports:
  canvas_width: 64
  canvas_height: 32
  logo_enabled: true
  
  one_item:
    away_logo:
      x: 2
      y: 2
      width: 12
      height: 12
    away_score:
      x: 18
      y: 4
      font_size: 12
      color: "away_team"
    home_logo:
      x: 2
      y: 18
      width: 12
      height: 12
    home_score:
      x: 18
      y: 20
      font_size: 12
      color: "home_team"
    period:
      x: 58
      y: 4
      font_size: 8
      align: "right"
      color: "time"
    clock:
      x: 58
      y: 20
      font_size: 8
      align: "right"
      color: "time"
  
  two_items:
    item_height: 16
    item_template:
      away_logo:
        x: 1
        y: 1
        width: 8
        height: 8
      away_score:
        x: 11
        y: 2
        font_size: 10
        color: "away_team"
      home_logo:
        x: 32
        y: 1
        width: 8
        height: 8
      home_score:
        x: 42
        y: 2
        font_size: 10
        color: "home_team"
      period:
        x: 58
        y: 2
        font_size: 7
        align: "right"
        color: "time"
  
  three_items:
    item_height: 10
    item_template:
      away_text:
        x: 1
        y: 1
        font_size: 8
        color: "away_team"
        format: "{abbr} {score}"
      home_text:
        x: 34
        y: 1
        font_size: 8
        color: "home_team"
        format: "{abbr} {score}"

# === STOCKS MODE ===
stocks:
  canvas_width: 64
  canvas_height: 32
  logo_enabled: false
  
  one_item:
    symbol:
      x: 2
      y: 4
      font_size: 10
      color: "white"
    price:
      x: 2
      y: 14
      font_size: 10
      color: "change_color"
    change:
      x: 2
      y: 24
      font_size: 9
      color: "change_color"
  
  two_items:
    item_height: 16
    item_template:
      symbol:
        x: 2
        y: 2
        font_size: 9
        color: "white"
      price:
        x: 20
        y: 2
        font_size: 9
        color: "change_color"
      change:
        x: 45
        y: 2
        font_size: 8
        color: "change_color"
  
  three_items:
    item_height: 10
    item_template:
      symbol:
        x: 1
        y: 1
        font_size: 8
        color: "white"
      price:
        x: 18
        y: 1
        font_size: 8
        color: "change_color"
      change:
        x: 42
        y: 1
        font_size: 7
        color: "change_color"

# === WEATHER MODE ===
weather:
  canvas_width: 64
  canvas_height: 32
  logo_enabled: false
  
  one_item:
    weather_icon:
      x: 2
      y: 2
      width: 16
      height: 16
    temperature:
      x: 22
      y: 4
      font_size: 14
      color: "white"
    feels_like:
      x: 22
      y: 16
      font_size: 8
      color: "gray"
    condition:
      x: 2
      y: 20
      font_size: 9
      color: "cyan"
    location:
      x: 2
      y: 28
      font_size: 7
      color: "gray"

