# 16×16 Layout Template - Tiny Square
# All mode layouts for 16×16 panel
# Perfect for: Single data point, minimal info

# === SPORTS MODE ===
sports:
  canvas_width: 16
  canvas_height: 16
  logo_enabled: false
  
  one_item:
    away_text:
      x: 1
      y: 1
      font_size: 6
      color: "away_team"
      format: "{abbr}"
    away_score:
      x: 1
      y: 7
      font_size: 6
      color: "away_team"
    home_text:
      x: 1
      y: 9
      font_size: 6
      color: "home_team"
      format: "{abbr}"
    home_score:
      x: 1
      y: 15
      font_size: 6
      color: "home_team"

# === STOCKS MODE ===
stocks:
  canvas_width: 16
  canvas_height: 16
  logo_enabled: false
  
  one_item:
    symbol:
      x: 1
      y: 1
      font_size: 6
      color: "white"
    price:
      x: 1
      y: 7
      font_size: 6
      color: "change_color"
    change:
      x: 1
      y: 13
      font_size: 6
      color: "change_color"

# === WEATHER MODE ===
weather:
  canvas_width: 16
  canvas_height: 16
  logo_enabled: false
  
  one_item:
    temperature:
      x: 2
      y: 4
      font_size: 8
      color: "white"
    condition_short:
      x: 1
      y: 12
      font_size: 6
      color: "cyan"

